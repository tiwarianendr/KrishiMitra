version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: krishimitra_db
    restart: always
    environment:
      POSTGRES_DB: krishimitra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: krishimitra_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:secure_postgres_password@db:5432/krishimitra
      PORT: 5000
      SECRET_KEY: production-super-secret-key
      JWT_SECRET_KEY: production-jwt-secret-key
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishimitra_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
